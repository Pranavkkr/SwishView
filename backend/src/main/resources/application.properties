spring.application.name=swishview

# SQLite Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlite:swishview2.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:94f6f874288b8d4f40d7e63b61405e3a8910b80db1e0896791b896942023a1ef}
jwt.expiration=86400000

# CORS & Admin
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.code=${ADMIN_CODE:admin123}

# Server Port
server.port=${PORT:8080}
